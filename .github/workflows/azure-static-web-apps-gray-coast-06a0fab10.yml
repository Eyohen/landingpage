name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Publishing in the CMS rebuilds staging but not production, which only
  # rebuilds when main moves. This gives an editor a "Run workflow" button to
  # promote published content without needing a commit: the build re-runs
  # prebuild, which fetches whatever is published at that moment.
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # The build moved out of the Azure action's Oryx container because
      # prerendering needs a headless browser, which Oryx does not provide.
      # We build here, then upload the finished dist/ with skip_app_build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          # Without this the prebuild step has no CMS to fetch from and the
          # deploy ships the committed manifest — i.e. whatever content the
          # last local fetch happened to capture. fetch-content.ts fails the
          # build rather than let that go out silently.
          VITE_CMS_URL: ${{ secrets.VITE_CMS_URL }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_COAST_06A0FAB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_COAST_06A0FAB10 }}
          action: "close"
